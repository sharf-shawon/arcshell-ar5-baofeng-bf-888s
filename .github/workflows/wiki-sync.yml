name: Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs
          commit-message: "Sync docs to Wiki"
        env:
          WIKI_ACTION_TOKEN: ${{ secrets.GITHUB_TOKEN }}

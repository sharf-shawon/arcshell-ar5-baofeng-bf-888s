# Site settings
title: "Arcshell AR-5 & BaoFeng BF-888S Guide"
description: "The definitive beginner's guide for BaoFeng BF-888S, Arcshell AR-5, and Pxton PX-888S radios. Learn programming, frequencies, and licensing."
url: "https://sharf-shawon.github.io" # Replace with actual GitHub Pages URL
baseurl: "/arcshell-ar5-baofeng-bf-888s" # Repo name

# Theme settings
remote_theme: just-the-docs/just-the-docs

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-relative-links

# SEO Metadata
twitter:
  username:
  card: summary_large_image
logo: "/assets/images/arcshell-ar-5.jpg"

# Just the Docs configuration
nav_order:
  - Home
  - Getting Started
  - Legal & Licensing
  - Programming
  - Factory Defaults
  - Frequencies
  - User Guides
  - Clones & Variants
  - Troubleshooting
  - Resources
  - Compatibility

# Auxiliary links in the sidebar
aux_links:
  "⭐ Star on GitHub":
    - "https://github.com/sharf-shawon/arcshell-ar5-baofeng-bf-888s"

# Footer content
footer_content: "Copyright &copy; 2024. Distributed under the Apache 2.0 License. Not affiliated with Arcshell or BaoFeng."

# Color scheme (customizations will be in assets/css/custom.css)
color_scheme: light

# Google Analytics (placeholder)
# google_analytics: "UA-XXXXXXXXX-X"

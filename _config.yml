##############################################################################
# Jekyll + Just the Docs configuration
# BaoFeng BF-888S / Arcshell AR-5 Complete Guide
##############################################################################

title: "BaoFeng BF-888S & Arcshell AR-5 Complete Guide"
description: >-
  The definitive beginner's guide for BaoFeng BF-888S, Arcshell AR-5, and
  Pxton PX-888S radios. Programming tutorials, CHIRP setup, factory default
  images, licensing info, and ham radio resources.
url: "https://sharf-shawon.github.io"
baseurl: "/arcshell-ar5-baofeng-bf-888s"

author:
  name: "sharf-shawon"
  url: "https://github.com/sharf-shawon"

##############################################################################
# Theme
##############################################################################

remote_theme: just-the-docs/just-the-docs@v0.10.1

##############################################################################
# Plugins
##############################################################################

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme

##############################################################################
# Just the Docs settings
##############################################################################

# Color scheme: custom (overridden in assets/css/custom.css)
color_scheme: nil

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: order   # rely on nav_order front matter
nav_external_links:
  - title: "⭐ Star on GitHub"
    url: "https://github.com/sharf-shawon/arcshell-ar5-baofeng-bf-888s"
    hide_icon: false

# Auxiliary links (top-right)
aux_links:
  "⭐ Star on GitHub":
    "https://github.com/sharf-shawon/arcshell-ar5-baofeng-bf-888s"

aux_links_new_tab: true

# Footer
footer_content: >-
  Released under the
  <a href="https://github.com/sharf-shawon/arcshell-ar5-baofeng-bf-888s/blob/main/LICENSE">Apache 2.0 License</a>.
  Maintained by <a href="https://github.com/sharf-shawon">sharf-shawon</a>.
  Found this useful? <a href="https://github.com/sharf-shawon/arcshell-ar5-baofeng-bf-888s">⭐ Star the repo!</a>

# Back-to-top link
back_to_top: true
back_to_top_text: "Back to top"

# Last-edit timestamp (requires git info)
last_edit_timestamp: true
last_edit_time_format: "%B %e, %Y"

# Callouts
callouts_level: quiet
callouts:
  warning:
    title: "⚠️ Warning"
    color: red
  important:
    title: "❗ Important"
    color: purple
  tip:
    title: "💡 Tip"
    color: green
  note:
    title: "📝 Note"
    color: blue
  legal:
    title: "⚖️ Legal Notice"
    color: yellow

# Heading anchor links
heading_anchors: true

# Enable copy code button
enable_copy_code_button: true

##############################################################################
# SEO / Social
##############################################################################

logo: "/assets/images/arcshell-ar-5-pair.jpg"
twitter:
  username: ""
social:
  name: "BaoFeng BF-888S Complete Guide"
  links:
    - "https://github.com/sharf-shawon/arcshell-ar5-baofeng-bf-888s"

##############################################################################
# Build settings
##############################################################################

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Collections — docs are in /docs
collections_dir: .

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - "*.sh"
  - README.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - SECURITY.md

# Permalink style
permalink: pretty

# Timezone
timezone: America/New_York
